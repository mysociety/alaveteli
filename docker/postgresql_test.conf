# configuration file for postgresql test db
# used in CI. This disables durability settings to speed up
# CI runs. See https://www.postgresql.org/docs/15/non-durability.html
# It is NOT recommended for use in development as the database can easily
# get corrupted, for instance if your machine loses power.
fsync = off
synchronous_commit = off
wal_level = minimal
full_page_writes = off
autovacuum = off
max_wal_size = 1GB
archive_mode = off
max_wal_senders = 0
shared_buffers = 256MB
# the only line from default config file
listen_addresses = '*'
