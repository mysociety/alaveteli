name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      skip_rspec: ${{ steps.skip.outputs.skip_rspec }}

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Check for [skip rspec]
      id: skip
      env:
        PR_DESCRIPTION: ${{ github.event.pull_request.body }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          if echo "$PR_DESCRIPTION" | grep -q "\[skip rspec\]"; then
            echo "Skip RSpec found in PR description. Passing the action."
            echo "skip_rspec=true" >> $GITHUB_OUTPUT
            exit
          fi
        fi
        echo "skip_rspec=false" >> $GITHUB_OUTPUT

  rspec:
    name: Ruby ${{ matrix.ruby }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest

    needs: check
    if: needs.check.outputs.skip_rspec == 'false'

    permissions:
      contents: read
      checks: write # for coverallsapp/github-action to create new checks

    strategy:
      fail-fast: false
      matrix:
        include:
        - { ruby: '3.4', postgres: 15.19 }

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alaveteli_test
      RAILS_ENV: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Start PostgreSQL
      run: |
        docker build \
          --build-arg POSTGRES_VERSION=${{ matrix.postgres }} \
          --file docker/Dockerfile-postgres --tag alaveteli-postgres .
        docker run --detach --name postgres \
          --env POSTGRES_PASSWORD=postgres --publish 5432:5432 \
          alaveteli-postgres
        for _ in $(seq 60); do
          if docker exec postgres \
               pg_isready -q -h 127.0.0.1 -U postgres -d alaveteli_test; then
            exit 0
          fi
          sleep 2
        done
        docker logs postgres
        exit 1

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: apt-${{ runner.os }}-${{ hashFiles('config/packages') }}

    - name: Install packages
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get -y update
        sudo apt-get -y install --no-install-recommends \
          exim4-daemon-light \
          $(cut -d ' ' -f 1 config/packages | grep -Ev '(^#|wkhtml|bundler|^ruby|^rake)')

    - name: Install Ruby ${{ matrix.ruby }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Configure application and storage
      run: |
        cp config/general.yml-example config/general.yml
        cp config/storage.yml-example config/storage.yml

    - name: Install theme
      run: |
        bundle exec rake themes:install

    - name: Migrate database
      run: |
        bundle exec rails db:migrate

    - name: Run core tests
      run: |
        bundle exec rspec --format Fivemat

    - name: Run nested gems tests
      run: |
        bundle exec rspec gems/*/spec --format Fivemat

    - name: Coveralls Parallel
      uses: coverallsapp/github-action@v2
      continue-on-error: true
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-${{ matrix.ruby }}-${{ matrix.gemfile || 'Gemfile' }}
        parallel: true
        fail-on-error: false

  coveralls:
    name: Coveralls
    runs-on: ubuntu-latest

    needs: rspec

    permissions:
      contents: read
      checks: write

    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
          fail-on-error: false
